import java.time.LocalDate
import java.time.ZoneOffset

def resolveCommitHash = {
    def githubSha = System.getenv('GITHUB_SHA')
    if (githubSha && githubSha.trim()) {
        return githubSha.trim().take(7)
    }
    try {
        def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
        process.waitFor()
        def hash = process.in.text.trim()
        return hash ? hash : 'local'
    } catch (Exception ignored) {
        return 'local'
    }
}

def now = LocalDate.now(ZoneOffset.UTC)
def dynamicVersion = "${now.year}.${now.monthValue}.${now.dayOfMonth}-${resolveCommitHash()}"

allprojects {
    version = dynamicVersion
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'

    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.42'
        annotationProcessor 'org.projectlombok:lombok:1.18.42'

        compileOnly 'org.jetbrains:annotations:26.0.2'
    }

    compileJava {
        options.encoding = 'UTF-8'
    }
}